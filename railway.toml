# Default service = API (backend).
# Preferred Railway setup: Root Directory = /backend + Config = /backend/railway.toml

[build]
builder = "RAILPACK"
buildCommand = "cd backend && npm ci && npx prisma generate && npm run build"

[deploy]
# Migrations run on start (pre-deploy often fails without shell / DB ready)
startCommand = "sh -c 'cd backend && npx prisma migrate deploy && node dist/main.js'"
healthcheckPath = "/api/docs"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
