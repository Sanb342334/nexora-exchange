# Default service = API (backend). In Railway you can also set Root Directory to /backend
# and Config File path to /backend/railway.toml

[build]
builder = "RAILPACK"
buildCommand = "cd backend && npm ci && npx prisma generate && npm run build"

[deploy]
startCommand = "cd backend && node dist/main.js"
preDeployCommand = ["cd backend && npx prisma migrate deploy"]
healthcheckPath = "/api/docs"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
