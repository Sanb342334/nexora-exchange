# Default service = API (backend).
# Preferred: Root Directory = /backend + Config = /backend/railway.toml

[build]
builder = "RAILPACK"
buildCommand = "cd backend && npm ci && npx prisma generate && npm run build"

[deploy]
startCommand = "sh -c 'cd backend && npx prisma migrate deploy && node dist/main.js'"
# Healthcheck off by default — enable in Railway UI with path /api/health after first green deploy
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
