thresholds:
  volume_spike_ratio: 4.0
  oi_jump_pct: 2.5
  price_vol_pct: 3.0
  min_score: 70
  max_spread_pct: 0.15
  btc_correlation_pct: 1.0
  funding_extreme_pct: 0.05

scoring:
  volume_weight: 30
  oi_weight: 25
  price_weight: 25
  orderflow_weight: 10
  btc_decouple_weight: 10

symbols:
  BTCUSDT:
    price_vol_pct: 1.5
    volume_spike_ratio: 3.0
  ETHUSDT:
    price_vol_pct: 2.0
    volume_spike_ratio: 3.5

blacklist: []
whitelist: []

paper:
  enabled: true
  slippage_pct: 0.05
  tp_atr_mult: 2.0
  sl_atr_mult: 1.0

digest:
  enabled: true
  interval_min: 60

risk:
  enabled: true
  account:
    demo_equity_usdt: 10000
    account_risk_pct: 0.75
  sizing:
    vol_ref_ratio: 4.0
    max_notional_usdt: 5000
  stops:
    method: blended
    min_rr: 1.8
  leverage:
    min: 2
    max: 10
  portfolio:
    max_open_positions:
      demo: 8
      live: 4
  limits:
    daily_loss_limit_pct:
      demo: 5.0
      live: 2.0
  live:
    require_explicit_enable: true
    min_score: 75

strategy:
  enabled: true
  confirm_min_sec: 30
  confirm_max_sec: 120
  min_vol_1m_usdt: 30000
  min_score_impulse: 65
  min_score_confirmed: 70
  min_score_hot: 85
  min_triggers_confirmed: 2
  fade_retrace_pct: 45
  fade_enabled: true
  require_orderflow_align: true
  impulse_alerts: true
  hot_bypass_confirm: true

traders:
  enabled: true
  equity_per_trader_usdt: 10000
  profiles:
    - id: sniper
      name: "Саша"
      emoji: "🎯"
      description: "Снайпер — только HOT, мало сделок"
      min_score: 85
      min_vol_1m_usdt: 100000
      leverage_max: 5
      allow_hot_only: true
      min_triggers: 3
    - id: strategist
      name: "Дима"
      emoji: "⚖️"
      description: "Стратег — баланс качества и ROI"
      min_score: 75
      min_vol_1m_usdt: 50000
      leverage_max: 10
    - id: agressor
      name: "Ваня"
      emoji: "🔥"
      description: "Агрессор — fade, низкий порог, 50x"
      min_score: 55
      min_vol_1m_usdt: 20000
      leverage_max: 50
      allow_fade: true
      min_sl_liq_buffer_pct: 0.08
      risk_mult: 1.6
      max_open: 10
    - id: kolya
      name: "Коля"
      emoji: "⚡"
      description: "Пульс+ — momentum CONFIRM/HOT, 10+ сделок/день"
      min_score: 48
      min_vol_1m_usdt: 12000
      min_triggers: 1
      leverage_max: 15
      momentum_only: true
      min_rr: 1.1
      risk_mult: 0.7
      max_open: 15
      min_sl_liq_buffer_pct: 0.10
    - id: misha
      name: "Миша"
      emoji: "🔬"
      description: "Рентген ленты — tape confluence, 30-50 микро-сделок/день"
      strategy: tape_sync
      min_score: 40
      max_score: 62
      min_vol_1m_usdt: 8000
      min_tape_points: 3
      leverage_max: 8
      min_rr: 1.05
      risk_mult: 0.35
      max_open: 30
      max_notional_usdt: 250
      min_sl_liq_buffer_pct: 0.06
      allow_fade: true
