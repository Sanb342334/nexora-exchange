# Production profile for Railway/Docker (shipped in image).
# Do not set CONFIG_PATH=config.local.yaml on Railway — that file is local-only.

thresholds:
  volume_spike_ratio: 2.0
  oi_jump_pct: 1.0
  price_vol_pct: 1.2
  min_score: 35
  max_spread_pct: 0.35
  btc_correlation_pct: 5.0
  funding_extreme_pct: 0.03

scoring:
  volume_weight: 30
  oi_weight: 25
  price_weight: 25
  orderflow_weight: 10
  btc_decouple_weight: 10

symbols:
  BTCUSDT:
    price_vol_pct: 0.8
    volume_spike_ratio: 1.5
  ETHUSDT:
    price_vol_pct: 1.0
    volume_spike_ratio: 1.8

blacklist: []
whitelist: []

paper:
  enabled: true
  slippage_pct: 0.05
  tp_atr_mult: 2.0
  sl_atr_mult: 1.0

digest:
  enabled: false
  interval_min: 60

risk:
  enabled: true
  account:
    demo_equity_usdt: 10000
    account_risk_pct: 0.75
  sizing:
    vol_ref_ratio: 4.0
    max_notional_usdt: 5000
  stops:
    method: blended
    min_rr: 1.8
    min_sl_distance_pct: 0.20
  leverage:
    min: 2
    max: 10
  portfolio:
    max_open_positions:
      demo: 50
      live: 4
  limits:
    daily_loss_limit_pct:
      demo: 100.0
      live: 2.0
  demo:
    allow_on_kill_switch: true
  live:
    require_explicit_enable: true
    min_score: 75

strategy:
  enabled: true
  confirm_min_sec: 15
  confirm_max_sec: 75
  min_vol_1m_usdt: 8000
  min_score_impulse: 30
  min_score_confirmed: 32
  min_score_hot: 75
  min_triggers_confirmed: 1
  fade_retrace_pct: 20
  fade_enabled: true
  require_orderflow_align: false
  impulse_alerts: true
  hot_bypass_confirm: true

carry:
  enabled: true
  paper_enabled: true
  min_net_carry_bps: 4
  fee_bps_per_leg: 4
  slippage_bps_per_leg: 2
  funding_uncertainty_bps: 3
  max_holding_minutes: 480
  max_unhedged_seconds: 20

indicator_mtf:
  enabled: true
  min_bars: 25
  min_volume_usdt_5m: 20000
  min_indicator_votes: 4
  min_confirm_15m: 3
  max_spread_pct: 0.15
  rsi_period: 14
  cooldown_sec: 90

traders:
  enabled: true
  equity_per_trader_usdt: 10000
  profiles:
    - id: misha
      name: "Миша"
      emoji: "📼"
      description: "Tape/FADE sync, adaptive learn"
      strategy: tape_sync
      execution_mode: demo
      adaptive_learn: true
      min_score: 30
      max_score: 70
      min_vol_1m_usdt: 5000
      min_tape_points: 1
      max_spread_pct: 0.35
      leverage_max: 10
      min_rr: 0.45
      min_sl_distance_pct: 0.02
      risk_mult: 0.5
      max_open: 40
      max_notional_usdt: 200
      min_sl_liq_buffer_pct: 0.05
      allow_fade: true
    - id: katya
      name: "Катя"
      emoji: "⚖️"
      description: "Spot↔Linear арбитраж и хедж, депозит $1000"
      strategy: carry_arbitrage
      execution_mode: demo
      equity_usdt: 1000
      min_score: 15
      leverage_max: 2
      risk_mult: 0.35
      max_open: 8
      min_rr: 0.3
      max_notional_usdt: 900
    - id: oleg
      name: "Олег"
      emoji: "📊"
      description: "5 индикаторов · MTF 5m/15m · объёмные входы"
      strategy: indicator_mtf
      execution_mode: demo
      min_score: 55
      min_vol_1m_usdt: 15000
      leverage_max: 12
      risk_mult: 0.8
      max_open: 12
      min_rr: 1.0

telegram:
  min_notify_score: 60
