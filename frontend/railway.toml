# Railway: Root Directory = /frontend · Config = /frontend/railway.toml
#
# Variables:
#   BACKEND_URL = https://YOUR-API.up.railway.app

[build]
builder = "RAILPACK"
buildCommand = "npm ci && npm run build"

[deploy]
# Next.js reads PORT from env (Railway sets it). Do not hardcode ${PORT} shell syntax.
startCommand = "npx next start --hostname 0.0.0.0"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
