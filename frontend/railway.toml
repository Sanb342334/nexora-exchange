# Railway: Root Directory = /frontend · Config = /frontend/railway.toml
#
# Required Variables:
#   BACKEND_URL = https://YOUR-API.up.railway.app
#   PORT = 3000   (keep 3000 so public domain matches Next listen port)

[build]
builder = "RAILPACK"
buildCommand = "npm ci && npm run build"

[deploy]
startCommand = "npx next start -H 0.0.0.0 -p 3000"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
