name: Bybit Scanner CI

on:
  push:
    paths:
      - 'bybit-scanner/**'
  pull_request:
    paths:
      - 'bybit-scanner/**'

defaults:
  run:
    working-directory: bybit-scanner

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Download dependencies
        run: go mod tidy

      - name: Build
        run: go build -o bin/scanner ./cmd/scanner

      - name: Vet
        run: go vet ./...
